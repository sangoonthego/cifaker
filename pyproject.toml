[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prooflens"
version = "0.1.0"
description = "ProofLens: Research and Development of an AI-Generated Image Detection Model"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC-BY-NC-SA-4.0" }
authors = [
    { name = "ProofLens Research Team" }
]
dependencies = [
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.1.0,<3.0.0",
    "Pillow>=10.0.0,<12.0.0",
    "PyYAML>=6.0.1,<7.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "kaggle>=1.6.0,<2.0.0",
    "tqdm>=4.66.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
