name: ProofLens CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Lint, Format & Unit Tests (CPU)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU PyTorch and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      - name: Verify package import and pipeline CLI
        run: |
          python -c "import prooflens; print('ProofLens import OK')"
          python -m prooflens.data.cli --help

      - name: Run Ruff linter
        run: |
          ruff check .

      - name: Run Ruff formatting check
        run: |
          ruff format --check .

      - name: Generate synthetic test fixtures
        run: |
          python scripts/generate_fixtures.py

      - name: Audit synthetic fixtures
        run: |
          python scripts/audit.py --root data/fixtures

      - name: Run CPU smoke training
        run: |
          python scripts/train.py --config configs/smoke.yaml

      - name: Run pytest unit test suite
        run: |
          python -m pytest -q
