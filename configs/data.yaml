# ProofLens Dataset Configuration (Phase 0A Local & Phase 0B Kaggle)
dataset:
  name: "tiny_genimage"
  kaggle_id: "yangsangtai/tiny-genimage"
  kaggle_mount_path: "/kaggle/input/tiny-genimage"
  local_fixtures_root: "data/fixtures"
  local_fixtures_manifest: "data/manifests/fixtures.csv"

# Explicit folder-to-binary-label mapping (REAL = 0, FAKE = 1)
label_mapping:
  nature: 0
  real: 0
  ai: 1
  fake: 1

# Explicit split folder mapping
split_mapping:
  train: "train"
  val: "val"
  test: "test"

# Explicit generator folder mapping for Tiny GenImage
generator_mapping:
  imagenet_ai_0419_biggan: "biggan"
  imagenet_ai_0419_vqdm: "vqdm"
  imagenet_ai_0424_sdv5: "sdv5"
  imagenet_ai_0424_wukong: "wukong"
  imagenet_ai_0508_adm: "adm"
  imagenet_glide: "glide"
  imagenet_midjourney: "midjourney"
  mock_gan: "mock_gan"
  mock_diffusion: "mock_diffusion"
