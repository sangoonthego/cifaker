# ProofLens Local CPU Smoke Configuration (Phase 0A)
experiment:
  name: "local_smoke"
  seed: 42
  environment: "local"

dataset:
  root: "data/fixtures"
  manifest: "data/manifests/fixtures.csv"
  image_size: 64

model:
  name: "resnet50"
  pretrained: false
  num_classes: 1

training:
  device: "cpu"
  batch_size: 2
  max_batches: 2
  learning_rate: 0.001

output:
  directory: "artifacts/local_smoke"
